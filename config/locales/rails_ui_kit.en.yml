en:
  rails_ui_kit:
    modal:
      unsaved_changes_title: "Unsaved Changes"
      unsaved_changes_message: "You have unsaved changes. Are you sure you want to close?"
    confirm_dialog:
      title: "Confirmation required"
      message: "Are you sure?"
      confirm_label: "Confirm"
      cancel_label: "Cancel"
    toast:
      close_label: "Close notification"
      default_title: "Notification"
      region_label: "Notifications"
      actions_hint: "Press F8 to reach its actions."
    select:
      # The placeholder in the field at the top of a searchable Select's popup. It is the only
      # thing in that row that says what the row is for, so it is chrome, not content.
      search_placeholder: "Search…"
      no_results: "No results"
      # The clear button's own word. ui--select puts the field's name after it, so a screen
      # reader hears which field is being cleared -- "Clear", then "City" -- which is why this
      # is one word and not a sentence: the second half is the caller's, never translated here.
      clear_label: "Clear"
      # Interpolated in the browser as the filter narrows, so the count itself is not known when
      # this is rendered: the whole plural map is handed to ui--select, which picks with
      # Intl.PluralRules. Every form carries %{count}: `one` is a CLDR category, not the number
      # one -- French `one` covers 0, Russian `one` covers 21 -- so a literal numeral here would
      # be wrong the moment this file is translated.
      results:
        one: "%{count} result"
        other: "%{count} results"
    choices:
      # A checkbox group the browser has no "at least one checked" constraint for: this is both
      # the screen-reader hint beside the visual `*` and the message ui--choices hands
      # setCustomValidity, so a translation moves both at once.
      required_message: "Select at least one option."
    field:
      # Search mode's Select trigger is a <button>: ARIA bars aria-required on it, so this is
      # the one control that can't say "required" itself. The label carries it into the
      # trigger's accessible name instead (a hidden span named directly by aria-labelledby);
      # every other control states it on its own, and never renders this text.
      required_label: "required"
    character_counter:
      # The visible count at the end of the description line. Kept as a template, not composed
      # in the browser, so a locale can change the separator without a kit change.
      count: "%{count} / %{limit}"
      # Announced once, when the room left first reaches ten percent of the limit or less. The
      # whole plural map is handed to ui--character-count, which picks a category with
      # Intl.PluralRules once the count is known -- the same reason select.results is a map.
      remaining:
        one: "%{count} character remaining"
        other: "%{count} characters remaining"
      # Announced once, when the count first exceeds the limit (and again, once, when it comes
      # back under).
      over:
        one: "%{count} character over the limit"
        other: "%{count} characters over the limit"
    turbo_disable_with:
      processing: "Processing..."
    dark_mode:
      switch_to_light: "Switch to light mode"
      switch_to_dark: "Switch to dark mode"

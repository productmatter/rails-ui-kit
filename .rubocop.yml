AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - test/dummy/**/*
    - bin/**/*
    - vendor/**/*

Layout/LineLength:
  Max: 200

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 15

Metrics/BlockLength:
  Exclude:
    - rails_ui_kit.gemspec
    - test/**/*
